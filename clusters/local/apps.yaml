apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applications
  namespace: flux-system
spec:
  interval: 1m # will bring back to 10m later
  retryInterval: 1m
  timeout: 10m
  path: ./apps
  prune: true
  wait: true
  dependsOn:
    - name: controllers
  sourceRef:
    kind: GitRepository
    name: flux-system