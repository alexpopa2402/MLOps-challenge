apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applications
  namespace: flux-system
spec:
  interval: 1m # will bring back to 10m later
  retryInterval: 1m
  timeout: 10m
  path: ./apps
  prune: true
  wait: true
  dependsOn:
    - name: controllers
    - name: oauth2-proxy # so we dont't publish an ingress that points at an auth service which flux hasn't yet installed (not necessarily needed but good prevention for race conditions)
  sourceRef:
    kind: GitRepository
    name: flux-system