apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: applications
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./apps
  prune: true
  wait: true
  dependsOn:
    - name: controllers
    # depends on oauth2-proxy so we dont't publish an ingress that points at an auth service which flux hasn't yet installed
    - name: oauth2-proxy
  sourceRef:
    kind: GitRepository
    name: flux-system
